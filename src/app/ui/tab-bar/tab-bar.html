<nav class="bar" [attr.aria-label]="s.label">
  <a
    class="tab"
    routerLink="/"
    routerLinkActive="active"
    [routerLinkActiveOptions]="exactPath"
    ariaCurrentWhenActive="page"
  >
    <lucide-icon [img]="icons.freezer" [size]="24" [strokeWidth]="2" aria-hidden="true" />
    <span>{{ s.freezer }}</span>
  </a>

  <button type="button" class="add" [attr.aria-label]="s.add" (click)="onAdd()">
    <lucide-icon [img]="icons.add" [size]="28" [strokeWidth]="2" aria-hidden="true" />
  </button>

  <a class="tab" routerLink="/recipes" routerLinkActive="active" ariaCurrentWhenActive="page">
    <lucide-icon [img]="icons.recipes" [size]="24" [strokeWidth]="2" aria-hidden="true" />
    <span>{{ s.recipes }}</span>
  </a>
</nav>
