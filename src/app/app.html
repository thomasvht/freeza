<div class="container">
  @if (!authService.isAuthenticated()) {
    <app-auth-shell />
  } @else {
    <!-- Header -->
    <app-header (logout)="onLogout()" />

    <!-- Add/Edit Item Form -->
    <app-food-form
      [foodForm]="foodForm"
      [editingId]="editingId()"
      [categories]="categories"
      (submit)="addOrUpdateItem()"
      (cancel)="resetForm()"
    />

    <!-- Search and Filter Section -->
    <app-filter-section
      [filterForm]="filterForm"
      [categories]="categories"
    />

    <!-- Items List -->
    @if (getFilteredItems().length > 0) {
      <app-items-list
        [items]="sortItems(getFilteredItems())"
        (itemEdit)="editItem($event)"
        (itemDelete)="deleteItem($event)"
      />

      <!-- Statistics Footer -->
      <app-stats-footer [items]="getFilteredItems()" />
    }
  }
</div>
