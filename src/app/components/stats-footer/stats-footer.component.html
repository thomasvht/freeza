@if (items().length > 0) {
  <footer class="footer">
    <div class="stats">
      <span>📊 Total Items: <strong>{{ items().length }}</strong></span>
      <span>
        ⚠️ Expiring Soon:
        <strong>{{ expiringCount() }}</strong>
      </span>
      <span>
        🚨 Expired:
        <strong>{{ expiredCount() }}</strong>
      </span>
    </div>
  </footer>
}
