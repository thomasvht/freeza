<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Freeza</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#bfe3f7">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <script>
    // Apply the stored theme and its theme-color before first paint (key shared with ThemeService;
    // colours are --bg-solid from styles/tokens.scss).
    try {
      var t = localStorage.getItem('freeza-theme');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      var dark = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.querySelector('meta[name="theme-color"]').content = dark ? '#0d2740' : '#bfe3f7';
    } catch (e) {}
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
