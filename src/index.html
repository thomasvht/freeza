<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Freeza</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#bfe3f7">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    // Apply the stored theme before first paint (key shared with ThemeService).
    try {
      var t = localStorage.getItem('freeza-theme');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
